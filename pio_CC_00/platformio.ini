; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; CodeCell C6 (ESP32-C6-MINI-1-H8). No dedicated CodeCell C6 board definition
; exists in pioarduino, so the ESP32-C6-DevKitC-1 (same chip, 8MB flash) is used.
[env:codecell_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; CPU frequency
board_build.f_cpu = 160000000L

; Flash: 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Partition: "8M with spiffs (3MB APP/1.5MB SPIFFS)"
board_build.partitions = default_8MB.csv
board_build.filesystem = spiffs

; Native USB serial (CodeCell has no USB-UART chip)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
